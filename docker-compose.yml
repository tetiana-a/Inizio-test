# Lokální vývoj: docker compose up  →  http://localhost:3000
# Klíč k SERP API se načte ze souboru .env (viz .env.example).
services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Spuštění unit testů v kontejneru: docker compose run --rm test
  test:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm test"
    profiles: ["test"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Produkční build z Dockerfile: docker compose --profile prod up prod  →  http://localhost:8080
  prod:
    build: .
    profiles: ["prod"]
    ports:
      - "8080:3000"
    env_file:
      - path: .env
        required: false

volumes:
  node_modules:
