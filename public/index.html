<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SERP extraktor – organické výsledky Google</title>
    <meta name="description" content="Zadejte klíčové slovo a stáhněte organické výsledky z 1. strany Google ve formátu JSON nebo CSV." />
    <meta name="theme-color" content="#fbf8f1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <script>
      // Režim nastavit ještě před vykreslením, aby stránka neblikla.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("serp-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        const preload = Object.assign(document.createElement("link"), { rel: "preload", as: "image", type: "image/avif" });
        preload.href = theme === "dark" ? "/bg-dark.avif" : "/bg.avif";
        document.head.append(preload);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
    <script src="/effects.js" type="module"></script>
    <script src="/radio.js" type="module"></script>
    <script src="/theme.js" type="module"></script>
  </head>
  <body>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="hero-art" aria-hidden="true"></div>
    <canvas id="gold-canvas" aria-hidden="true"></canvas>
    <div class="cursor-glow" aria-hidden="true"></div>

    <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Tmavý režim">
      <span class="theme-label" aria-hidden="true"></span>
      <span class="theme-track" aria-hidden="true">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" /></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z" /></svg>
        <span class="theme-knob"></span>
      </span>
    </button>

    <main class="page">
      <header class="intro">
        <p class="eyebrow">Google&nbsp;<span>·</span> google.cz&nbsp;<span>·</span> 1.&nbsp;strana</p>
        <h1 class="title">SERP <em>extraktor</em></h1>
        <p class="lead">Organické výsledky pro zadané klíčové slovo – bez reklam, ke stažení jako JSON nebo CSV.</p>
      </header>

      <form id="search-form" class="search" role="search" novalidate>
        <label for="q" class="visually-hidden">Klíčové slovo</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
        <input id="q" name="q" type="search" maxlength="200" placeholder="např. kávovar brno" autocomplete="off" required autofocus />
        <button type="submit" id="submit" class="btn-gold"><span>Vyhledat</span></button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="output" class="output" hidden>
        <div class="toolbar">
          <p id="meta" class="meta"></p>
          <div class="downloads">
            <a id="download-json" class="btn-outline" download>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" /></svg>
              JSON
            </a>
            <a id="download-csv" class="btn-outline" download>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" /></svg>
              CSV
            </a>
          </div>
        </div>
        <ol id="results" class="results"></ol>
      </section>
    </main>

    <footer class="footer">
      <span>Tetiana Kotolup</span><span class="dot" aria-hidden="true">◆</span><span>2026</span><span class="dot" aria-hidden="true">◆</span><span>data: SerpApi</span>
    </footer>

    <aside class="radio" id="radio" data-state="paused" aria-label="Rádio">
      <button class="radio-play" id="radio-play" type="button" aria-pressed="false" aria-label="Pustit rádio">
        <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.5" /></svg>
        <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z" /></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z" /></svg>
      </button>
      <div class="radio-info">
        <span class="radio-label">Rádio</span>
        <span class="radio-station" id="radio-station">Zlatý ambient</span>
        <span class="radio-note" id="radio-note" aria-live="polite"></span>
      </div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <button class="radio-next" id="radio-next" type="button" aria-label="Další stanice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l7 6-7 6M14 6l7 6-7 6" /></svg>
      </button>
    </aside>
  </body>
</html>
